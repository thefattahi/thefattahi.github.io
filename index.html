<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fattahi — photography portfolio.">
  <title>Fattahi — Photography</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Fattahi home">fattahi</a>
    <a class="profile" href="#about" aria-label="About">RF</a>
  </header>

  <main>
    <section class="intro">
      <p>Photography</p>
      <p>Berlin / Germany</p>
    </section>

    <section class="gallery" aria-label="Photography portfolio">
      <figure class="photo-card">
        <img src="images/photo-01.jpg" alt="Photography portfolio image 01">
        <figcaption>Late afternoon</figcaption>
      </figure>

      <figure class="photo-card">
        <img src="images/photo-02.jpg" alt="Photography portfolio image 02">
        <figcaption>Between places</figcaption>
      </figure>

      <figure class="photo-card">
        <img src="images/photo-03.jpg" alt="Photography portfolio image 03">
        <figcaption>No particular place</figcaption>
      </figure>
    </section>

    <section id="about" class="about">
      <p>Fattahi is a personal photography archive by Rasool Fattahi.</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Fattahi</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>

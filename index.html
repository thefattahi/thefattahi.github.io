<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography archive by Rasool Fattahi.">
  <meta name="theme-color" content="#f6f5f2">
  <title>Fattahi - Photo Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <button class="identity" type="button" aria-label="Open portrait of Rasool Fattahi">
      <span class="identity-copy">
        <span class="identity-kicker">Photos by</span>
        <span class="identity-name">Rasool Fattahi</span>
      </span>
      <span class="portrait-frame">
        <img src="images/profile.png" alt="Portrait of Rasool Fattahi">
      </span>
    </button>
  </header>

  <main>
    <section class="gallery" aria-label="Photography portfolio">
      <figure class="photo-card photo-card--landscape">
        <button class="photo-button" type="button" data-src="images/photo-01.jpg" data-caption="Late afternoon" aria-label="Open photograph: Late afternoon">
          <img src="images/photo-01.jpg" alt="Photography portfolio image 01" loading="eager" decoding="async">
        </button>
        <figcaption>Late afternoon</figcaption>
      </figure>

      <figure class="photo-card photo-card--portrait">
        <button class="photo-button" type="button" data-src="images/photo-02.jpg" data-caption="Between places" aria-label="Open photograph: Between places">
          <img src="images/photo-02.jpg" alt="Photography portfolio image 02" loading="lazy" decoding="async">
        </button>
        <figcaption>Between places</figcaption>
      </figure>

      <figure class="photo-card photo-card--square">
        <button class="photo-button" type="button" data-src="images/photo-03.jpg" data-caption="No particular place" aria-label="Open photograph: No particular place">
          <img src="images/photo-03.jpg" alt="Photography portfolio image 03" loading="lazy" decoding="async">
        </button>
        <figcaption>No particular place</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Rasool Fattahi</span>
  </footer>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close photograph">×</button>
    <img class="lightbox-image" src="" alt="">
    <p class="lightbox-caption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>

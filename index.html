<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Photography archive by Rasool Fattahi."
  >

  <meta
    name="theme-color"
    content="#f6f5f2"
  >

  <title>Fattahi - Photo Archive</title>

  <link
    rel="stylesheet"
    href="style.css?v=9"
  >

</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <button
      class="identity"
      id="profileButton"
      type="button"
      aria-label="Open portrait of Rasool Fattahi"
    >

      <span class="identity-copy">

        <span class="identity-kicker">
          Photos by
        </span>

        <span class="identity-name">
          Rasool Fattahi
        </span>

      </span>


      <span class="portrait-frame">

        <img
          src="images/profile.png"
          alt="Portrait of Rasool Fattahi"
        >

      </span>

    </button>

  </header>



  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>


    <!-- CATEGORY FILTER -->

    <nav
      class="category-filter"
      aria-label="Photography categories"
    >

      <button
        class="category-button is-active"
        data-category="All"
        type="button"
      >
        All
      </button>


      <button
        class="category-button"
        data-category="Street"
        type="button"
      >
        Street
      </button>


      <button
        class="category-button"
        data-category="Portrait"
        type="button"
      >
        Portrait
      </button>


      <button
        class="category-button"
        data-category="Documentary"
        type="button"
      >
        Documentary
      </button>


      <button
        class="category-button"
        data-category="Places"
        type="button"
      >
        Places
      </button>

    </nav>



    <!-- GALLERY -->

    <section
      class="gallery"
      id="gallery"
      aria-label="Photography portfolio"
    >

      <!-- JavaScript creates the photographs here -->

    </section>


  </main>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    © <span id="year"></span> Rasool Fattahi

  </footer>



  <!-- =====================================================
       LIGHTBOX
  ====================================================== -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
  >

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image"
    >
      ×
    </button>


    <img
      class="lightbox-image"
      id="lightboxImage"
      src=""
      alt=""
    >


    <div
      class="lightbox-caption"
      id="lightboxCaption"
    ></div>

  </div>



  <!-- =====================================================
       SCRIPTS
  ====================================================== -->

  <script src="photos.js?v=9"></script>

  <script src="script.js?v=9"></script>


</body>

</html>

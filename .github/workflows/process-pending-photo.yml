name: Process pending photo

on:
  push:
    paths:
      - 'scripts/pending-photo.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepend photo metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pending = JSON.parse(fs.readFileSync('scripts/pending-photo.json', 'utf8'));
          const path = 'photos.js';
          let source = fs.readFileSync(path, 'utf8');
          const marker = 'const photos = [';
          if (!source.startsWith(marker)) throw new Error('Unexpected photos.js format');
          if (source.includes(`"file": "${pending.file}"`) || source.includes(`file: "${pending.file}"`)) {
            console.log('Photo already present; skipping prepend.');
            process.exit(0);
          }
          const block = '  ' + JSON.stringify(pending, null, 2).replace(/\n/g, '\n  ') + ',\n';
          source = marker + '\n' + block + source.slice(marker.length + 1);
          fs.writeFileSync(path, source);
          NODE

      - name: Generate photo detail pages
        run: node scripts/generate-photo-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit publication assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/pending-photo.json .github/workflows/process-pending-photo.yml
          git add photos.js photos sitemap.xml scripts/pending-photo.json .github/workflows/process-pending-photo.yml
          git diff --cached --quiet || git commit -m "Publish Rijksmuseum crucifix photo"
          git push

name: Update photo SEO pages and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'photos.js'
      - 'scripts/pending-photo.json'
      - 'images/**'
      - 'scripts/generate-photo-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

concurrency:
  group: photo-seo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  seo-assets:
    # Generated SEO commits are already processed; skip only this workflow job
    # while allowing the normal GitHub Pages deployment to run.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: sync photo SEO pages and sitemap') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pending photo metadata when image exists
        if: ${{ hashFiles('scripts/pending-photo.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pendingPath = 'scripts/pending-photo.json';
          const photosPath = 'photos.js';
          const pending = JSON.parse(fs.readFileSync(pendingPath, 'utf8'));
          const imagePath = `images/${pending.file}`;
          if (!fs.existsSync(imagePath)) {
            console.log(`Pending photo kept: ${imagePath} is not in the repository yet.`);
            process.exit(0);
          }
          const source = fs.readFileSync(photosPath, 'utf8');
          const marker = `file: ${JSON.stringify(pending.file)}`;
          if (!source.includes(marker)) {
            const block = JSON.stringify(pending, null, 2)
              .replace(/^/gm, '  ')
              .replace(/\"([A-Za-z_][A-Za-z0-9_]*)\":/g, '$1:');
            const updated = source.replace('const photos = [', `const photos = [\n${block},`);
            if (updated === source) throw new Error('Could not locate photos array.');
            fs.writeFileSync(photosPath, updated);
          }
          fs.rmSync(pendingPath);
          NODE

      - name: Generate photo detail pages
        run: node scripts/generate-photo-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit generated SEO assets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos.js photos sitemap.xml scripts/pending-photo.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync photo SEO pages and sitemap"
            git push
          else
            echo "No generated changes to commit."
          fi

name: Update photo SEO pages and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'photos.js'
      - 'scripts/generate-photo-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
  workflow_dispatch:

concurrency:
  group: photo-seo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  seo-assets:
    # Generated SEO commits use [skip ci] so they do not start a second SEO run.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate photo detail pages
        run: node scripts/generate-photo-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit generated SEO assets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync photo SEO pages and sitemap [skip ci]"
            git push
          else
            echo "No generated changes to commit."
          fi

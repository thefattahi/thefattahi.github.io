name: Update image sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Ensure reciprocal Persian hreflang
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = '  <link rel="alternate" hreflang="en" href="https://thefattahi.github.io/">\n'
          fa = '  <link rel="alternate" hreflang="fa" href="https://thefattahi.github.io/fa/">\n'
          if fa not in text:
              text = text.replace(marker, marker + fa, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit sitemap and SEO changes when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml index.html
          git diff --cached --quiet || git commit -m "chore: add reciprocal Persian hreflang"
          git push
